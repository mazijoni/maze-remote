name: Build agent

on:
  push:
    branches: [main]
    paths: ["agent/**", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: agent/go.sum
      - name: Build
        working-directory: agent
        run: |
          mkdir -p ../dist
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o ../dist/maze-remote-agent.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags "-s -w" -o ../dist/maze-remote-agent-arm64.exe .
          GOOS=linux   GOARCH=amd64 go build -ldflags "-s -w" -o ../dist/maze-remote-agent-linux .
          cp maze-remote.example.json ../dist/maze-remote.json
      - uses: actions/upload-artifact@v4
        with:
          name: maze-remote-agent
          path: dist/*
      - name: Publish release (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
      - name: Publish "latest" release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automatic build of the newest code on `main`.
            Download `maze-remote-agent.exe` for Windows (x64), edit `maze-remote.json`, and run it.
          make_latest: true
          files: dist/*
